volumes:
  classroom_data:

services:
  db:
    container_name: classroom-database
    image: postgres:17-alpine
    restart: on-failure
    ports:
      - 5435:5432
    environment:
      - POSTGRES_DB=classroom
      - POSTGRES_USER=local
      - POSTGRES_PASSWORD=local
    volumes:
      - classroom_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local -d classroom']
      interval: 5s
      timeout: 3s
      retries: 10

  bot-discord:
    container_name: classroom-bot-discord
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/bot/.env

  bot-assignment:
    container_name: classroom-bot-assignment
    build:
      context: ./apps/assignment-bot
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/assignment-bot/.env
    environment:
      # Inside the compose network the database is `db:5432`, not 127.0.0.1.
      - DATABASE_URL=postgresql://local:local@db:5432/classroom
    ports:
      - 4005:4005
